services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-production-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    healthcheck:
      test: ["/bin/server", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
