# Example only. Never commit a real credential. Create the Secret out of band:
#
#   kubectl create secret generic orders-api \
#     --from-literal=APP_DATABASE_URL='postgres://user:pass@db:5432/orders'
#
# The Deployment mounts this key as a file so the value can rotate in place.
apiVersion: v1
kind: Secret
metadata:
  name: orders-api
type: Opaque
stringData:
  APP_DATABASE_URL: "postgres://REPLACE_ME"
