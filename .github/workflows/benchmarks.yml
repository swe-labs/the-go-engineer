name: Benchmarks

on: [push, pull_request]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Run Benchmarks
        run: go test -bench=. -benchmem -count=1 ./curriculum/modules/02-go-setup-tooling/lessons/05-go-test/
